name: Find Jira Issue Keys In GitHub Event
description: This action will find the issue keys in the GitHub event and return them as a comma separated list
branding:
  icon: 'chevron-right'
  color: 'blue'
inputs:
  token:
    description: GitHub token for reading commit history or updating pull requests; string, branch, and title extraction do not require it
    required: false
  from:
    description: >
      Find from predefined place.
      Can be 'branch', 'pull_request' (title), 'string', 'commits', or 'all'; default is 'commits'
    required: false
    default: commits
  string:
    description: A string to search for issues
    required: false
    default: ''
  projects:
    description: >
      A comma separated list of project names to include in the results by, i.e. DEVOPS,PROJECT1
    required: false
    default: ''
  projects_ignore:
    description: >
      A comma separated list of project names to exclude from the results by, i.e. INTERNAL,PROJECT2
    required: false
  include_merge_messages:
    description: >
      When parsing commit messages, include merge and pull messages.
      This is disabled by default, to exclude tickets that may be included
      or fixed in other branches or pull requests.
    required: false
    default: 'false'
  head_ref:
    description: >
      The Git Head Ref to which commit messages will be collected up to.
      Overrides the head reference from the GitHub event when provided.
    required: false
  base_ref:
    description: >
      The Git Base Ref to which commit messages will be collected up from.
    required: false
  ignore_commits:
    description: >
      Should the commit messages be ignored when looking for issues
    required: false
    default: false
  github_api_url:
    description: >
      The URL of the GitHub API to use.
      This allows those with GitHub Enterprise to use the GitHub Enterprise API.
    required: false
  github_enterprise_server_version:
    description: >
      The version of the GitHub Enterprise Server to use.
      This allows those with GitHub Enterprise to use the GitHub Enterprise API.
      Available versions to use: 3.2, 3.3, 3.4, 3.5
    required: false
    default: '3.5'
  jira_base_url:
    description: >
      Jira base URL including protocol, or environment variable JIRA_BASE_URL.
      Required only when update_pull_request is enabled on a pull request event.
    required: false
  jira_user_email:
    description: >
      Jira Cloud email or Data Center Basic-auth username, or environment variable JIRA_USER_EMAIL.
      Required only for pull request enrichment.
    required: false
  jira_api_token:
    description: >
      Jira Cloud API token or Data Center Basic-auth password, or environment variable JIRA_API_TOKEN.
      Required only for pull request enrichment; this is not a Bearer/PAT input.
    required: false
  fail_on_error:
    description: Fail the step if extraction, Jira enrichment, or the GitHub update fails; enable this for CI validation
    default: 'false'
    required: false
  update_pull_request:
    description: >
      Fetch Jira issue details and update the pull request title/body with the keys found.
      Disabled by default; extraction alone does not contact Jira.
    required: false
    default: false
outputs:
  projects_included:
    description: >
      A comma separated list of projects from the 'projects' input provided
  projects_excluded:
    description: >
      A comma separated list of ignored projects from the 'projects_ignore' input provided
  projects_found:
    description: >
      A comma separated list of project names to include in the results by, i.e. DEVOPS,PROJECT1
  issue:
    description: >
      The first Jira issue key found in the event
  issues:
    description: >
      A comma separated list of all Jira Issues found
  title_issues:
    description: >
      A comma separated list of Jira Issues found in the pull_request title
  commit_issues:
    description: >
      A comma separated list of Jira Issues found in the commits provided
  ref_issues:
    description: >
      A comma separated list of Jira Issues found in the git ref
  string_issues:
    description: >
      A comma separated list of Jira Issues found in the input string

runs:
  using: 'node24'
  main: './lib/index.js'
