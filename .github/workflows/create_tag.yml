name: 🏷️ Update Package Version and Create Tag
on:
  workflow_run:
    workflows: ['Jira Integration E2E']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Publish tested commit and tag
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        name: Checkout the revision that passed Jira E2E tests
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Reject a stale or mismatched test run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git fetch --no-tags origin refs/heads/main
          if [ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ]; then
            echo '::error::main has moved since this revision passed Jira E2E tests.'
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
      - name: Install from the lockfile
        run: node .yarn/releases/yarn-3.3.0.cjs install --immutable
      - name: Lint source and tests
        run: node .yarn/releases/yarn-3.3.0.cjs lint:source
      - name: Check workflow definitions
        uses: docker://rhysd/actionlint:1.7.12
      - name: Run unit and release regression tests
        run: |
          node .yarn/releases/yarn-3.3.0.cjs test:ci --runInBand
          node .yarn/releases/yarn-3.3.0.cjs test:release
      - name: Type check, build, and verify the tested action
        run: |
          node .yarn/releases/yarn-3.3.0.cjs build
          git diff --exit-code -- lib
          node .yarn/releases/yarn-3.3.0.cjs test:packaged
      - name: Set release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare and validate the release commit and tag
        id: version
        run: |
          git fetch --tags origin
          node .github/scripts/prepare-release.cjs
      - name: Publish the release commit and exact tag atomically
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD^)" = "$TESTED_SHA"
          git diff --exit-code "$TESTED_SHA" "$RELEASE_COMMIT" -- src lib action.yml yarn.lock
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$TESTED_SHA"
          git push --atomic origin \
            "${RELEASE_COMMIT}:refs/heads/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

  # Re-run failed jobs or this release job to retry without repeating the stale-main guard.
  release:
    name: Create GitHub release
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the GitHub release for the published tag
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          target_commitish: ${{ needs.tag.outputs.commit }}
          name: Release ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
