name: Code Linting
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: Lint, tests, and packaged action
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install from the lockfile
        run: node .yarn/releases/yarn-3.3.0.cjs install --immutable
      - name: Lint source and tests
        run: node .yarn/releases/yarn-3.3.0.cjs lint:source
      - name: Check workflow definitions
        uses: docker://rhysd/actionlint:1.7.12
      - name: Unit tests
        run: node .yarn/releases/yarn-3.3.0.cjs test:ci --runInBand
      - name: Release safety regression tests
        run: node .yarn/releases/yarn-3.3.0.cjs test:release
      - name: Type check and build packaged action
        run: node .yarn/releases/yarn-3.3.0.cjs build
      - name: Verify committed bundle
        run: git diff --exit-code -- lib
      - name: Test packaged action inputs, API behavior, outputs, and failures
        run: node .yarn/releases/yarn-3.3.0.cjs test:packaged
