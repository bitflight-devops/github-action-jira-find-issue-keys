name: Test Find Issue Key
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-find-issue-key:
    name: Find Issue Key
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract and deduplicate without credentials
        id: string
        uses: ./
        with:
          from: string
          string: 'DVPS-342 DVPS-342 SOMEPROJ-123'
          fail_on_error: true
      - name: Include one project
        id: project
        uses: ./
        with:
          from: string
          string: 'DVPS-342 SOMEPROJ-123'
          projects: SOMEPROJ
          fail_on_error: true
      - name: Exclude all matches
        id: empty
        uses: ./
        with:
          from: string
          string: 'DVPS-342'
          projects_ignore: DVPS
          fail_on_error: true
      - name: Assert actual action outputs
        env:
          FIRST_ISSUE: ${{ steps.string.outputs.issue }}
          ALL_ISSUES: ${{ steps.string.outputs.issues }}
          FILTERED_ISSUE: ${{ steps.project.outputs.issue }}
          FILTERED_ISSUES: ${{ steps.project.outputs.issues }}
          EMPTY_ISSUE: ${{ steps.empty.outputs.issue }}
          EMPTY_ISSUES: ${{ steps.empty.outputs.issues }}
        run: |
          test "$FIRST_ISSUE" = 'DVPS-342'
          test "$ALL_ISSUES" = 'DVPS-342,SOMEPROJ-123'
          test "$FILTERED_ISSUE" = 'SOMEPROJ-123'
          test "$FILTERED_ISSUES" = 'SOMEPROJ-123'
          test -z "$EMPTY_ISSUE"
          test -z "$EMPTY_ISSUES"
