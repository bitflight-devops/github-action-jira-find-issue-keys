name: Clean up a controlled test release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact test tag: vMAJOR.MINOR.PATCH-repair.RUN.ATTEMPT'
        required: true
        type: string
      expected_sha:
        description: 'Full commit SHA recorded when the test release was created'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cleanup-test-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate ownership and delete only the named test release and tag
        uses: actions/github-script@v8
        env:
          TEST_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const tag = process.env.TEST_TAG;
            const expected = process.env.EXPECTED_SHA;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+-repair\.[0-9]+\.[0-9]+$/.test(tag)) {
              throw new Error('Only explicitly named repair test tags can be removed.');
            }
            if (!/^[a-f0-9]{40}$/.test(expected)) {
              throw new Error('The expected full commit SHA is required.');
            }
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: tag });
            if (commit.sha !== expected) throw new Error('Test tag does not target the expected commit.');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (release.tag_name !== tag || !release.prerelease) {
              throw new Error('The named release must be a prerelease.');
            }
            await github.rest.repos.deleteRelease({ ...context.repo, release_id: release.id });
            await github.rest.git.deleteRef({ ...context.repo, ref: `tags/${tag}` });
            core.info(`Deleted controlled test release ${tag} at ${expected}.`);
